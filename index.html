<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>luniverse</title>

    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #f9f0ec;
        z-index: 2147483647;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 260ms ease, transform 260ms ease;
      }

      html.routeRoot .splash {
        display: grid;
      }

      .splashInner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }

      .splashIcon {
        width: 96px;
        height: 96px;
        object-fit: contain;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform, opacity;
      }

      @keyframes splashBreathe {
        0% {
          transform: scale(0.985);
          opacity: 0.92;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.985);
          opacity: 0.92;
        }
      }

      html.routeRoot .splashIcon {
        animation: splashBreathe 880ms ease-in-out both;
      }

      .splashTitle {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.2px;
        color: rgba(15, 23, 42, 0.92);
      }

      .splashSlogan {
        max-width: 30rem;
        font-size: 14px;
        line-height: 1.4;
        letter-spacing: 0.2px;
        color: rgba(15, 23, 42, 0.82);
      }

      .splashDots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: -2px;
        height: 18px;
        color: rgba(15, 23, 42, 0.62);
        font-size: 18px;
        line-height: 1;
      }

      .splashAttribution {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        padding: 0 16px;
        text-align: center;
        font-size: 11px;
        line-height: 1.3;
        letter-spacing: 0.2px;
        color: rgba(15, 23, 42, 0.62);
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
      }

      .splashDot {
        opacity: 0.22;
        transform: translateY(-1px);
        animation: splashDotPulse 900ms infinite ease-in-out;
      }

      .splashDot:nth-child(2) {
        animation-delay: 150ms;
      }

      .splashDot:nth-child(3) {
        animation-delay: 300ms;
      }

      @keyframes splashDotPulse {
        0%,
        80%,
        100% {
          opacity: 0.22;
        }
        40% {
          opacity: 1;
        }
      }

      .splashFadeOut {
        opacity: 0;
        transform: translateY(-2px);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition: none;
        }

        html.routeRoot .splashIcon {
          animation: none;
        }

        .splashDot {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>

    <script>
      (function () {
        var path = location.pathname || "/";
        var isRoot = path === "/" || path === "/index.html";
        if (isRoot) document.documentElement.classList.add("routeRoot");
      })();
    </script>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splashInner">
        <img class="splashIcon" src="/voiceland.png" alt="Voiceland" />
        <div class="splashTitle">&#x58F0;&#x5C9B;</div>
        <div class="splashSlogan">
          &#x8BA9;&#x597D;&#x58F0;&#x97F3;&#x4E0D;&#x518D;&#x6F02;&#x6D41;&#xFF0C;&#x8BA9;&#x5171;&#x9E23;&#x4E0D;&#x6B62;&#x4E8E;&#x6536;&#x542C;
        </div>
        <div class="splashDots" aria-hidden="true">
          <span class="splashDot">.</span>
          <span class="splashDot">.</span>
          <span class="splashDot">.</span>
        </div>
      </div>
      <div class="splashAttribution">By Enactflow from Hangzhou</div>
    </div>
    <div id="root"></div>

    <script>
      (function () {
        if (!document.documentElement.classList.contains("routeRoot")) return;
        var splash = document.getElementById("splash");
        if (!splash) return;

        var SHOW_MS = 1880;
        var FADE_MS = 260;

        window.setTimeout(function () {
          splash.classList.add("splashFadeOut");
          window.setTimeout(function () {
            splash.remove();
          }, FADE_MS + 50);
        }, SHOW_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
